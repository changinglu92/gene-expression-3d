<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="基因的表达 · 基因指导蛋白质的合成 —— 3D 互动课件（人教版 2019 必修2 第4章第1节）">
<title>基因的表达 · 3D 互动课件</title>
<style>:root{--bg:#dfe7ec;--ink:#1d2633;--mut:#5b6878;--line:rgba(30,50,70,.12);--card:rgba(255,255,255,.86);--pri:#2f62b0;--acc:#d24f8f;--ok:#2fa35a;--bad:#d64531;
--font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Noto Serif CJK SC",system-ui,sans-serif;--lw:340px;--rw:318px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;transition:.15s}
button:hover{border-color:#9db3cc}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(255,255,255,.9);border:1.5px solid #2f62b0;color:#173052;padding:3px 9px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.tag.end{background:#1d2633;color:#fff;border:0;padding:1px 7px;font-size:12px}
.tag.site{background:#fff7e6;border-color:#f39c3d;color:#8a4a00;font-size:12px;padding:1px 7px}
.tag.ac{background:#fff3df;border-color:#f0a23a;color:#7a4300}
.lt{position:absolute;left:0;top:0;font:800 13px/1 var(--font);color:#fff;background:var(--c);border-radius:5px;padding:2px 4px;text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lt.hl{outline:3px solid #ffd400;transform-origin:center;font-size:16px}
.lt.codon{background:rgba(255,255,255,.92);color:#1d2633;border:1.5px solid #8a96a5;letter-spacing:1px;text-shadow:none;font-size:13px}
.lt.codon.stop{border-color:var(--bad);color:var(--bad)}
.lt.aa{font-size:11px;border-radius:999px;padding:2px 5px;background:var(--c)}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:5;display:flex;gap:14px;align-items:center;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:0 6px 24px rgba(20,40,60,.1)}
.brand{display:flex;gap:10px;align-items:center;min-width:250px}.logo{font-size:26px}
.ttl{font-weight:800;font-size:17px}.sub{color:var(--mut);font-size:12px}
.mainline{flex:1;min-width:0}.mq{font-size:13px;line-height:1.4}.mq b{background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px;font-size:12px}
.chain{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}.arr{color:#99a5b3}
.cc{padding:2px 9px;border-radius:999px;font-size:12px;display:flex;gap:5px;align-items:baseline}.cc span{color:var(--mut);font-size:11px}.cc.on{background:#ffeaf3;border-color:var(--acc)}
.tools{display:flex;gap:6px}.ghost{background:transparent}.only-narrow{display:none}
#steps{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;max-width:calc(100% - 20px);overflow-x:auto;padding:4px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:999px;background:rgba(255,255,255,.85);font-size:13px;padding:5px 12px 5px 6px;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#e7edf3;display:grid;place-items:center;font-size:11px;font-weight:700}
.chip.done i{background:#cfe9d8;color:#1f7a43}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.on i{background:#fff;color:var(--pri)}
aside{position:fixed;top:136px;bottom:74px;z-index:4;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;overflow-y:auto;box-shadow:0 6px 24px rgba(20,40,60,.1)}
#left{left:10px;width:var(--lw);padding:14px 16px;transition:transform .25s}#right{right:10px;width:var(--rw);padding:12px 14px}
body.hide-left #left,body.hide-left #xuean{transform:translateX(-110%)!important}
#right{transition:transform .25s}
body.hide-right #right{transform:translateX(110%)!important}
.left-close{font-size:12px;padding:3px 9px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{background:#e8f0fb;color:var(--pri);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}.unit{color:var(--mut);font-size:12px}
#left h2{margin:8px 0 6px;font-size:20px}
#left section{margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);border-left:4px solid #c5d0db}
#left h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
#left p,#left li{margin:0;line-height:1.6;font-size:14px}#left ul{margin:0;padding-left:18px}#left li{margin:3px 0}
#left .q{border-color:var(--acc)}#left .q p{font-weight:700;font-size:15px}#left .act{border-color:var(--pri)}#left .exp{border-color:#f39c3d}#left .concl{border-color:var(--ok)}#left .ref p{color:var(--mut);font-size:12.5px}
.hid{filter:blur(6px);user-select:none;opacity:.6}.reveal{font-size:12px;padding:1px 8px;border-radius:999px}
.quiz{border-color:#8e44ad!important}.quiz .stem{font-weight:700;margin-bottom:6px!important}.opt{display:block;width:100%;text-align:left;margin:4px 0;line-height:1.45}
.opt.right{background:#e3f6ea;border-color:var(--ok)}.opt.wrong{background:#fde8e5;border-color:var(--bad)}.quiz .explain{margin-top:6px!important;font-size:13px!important;color:#3b2a52}.quiz .ans{margin-top:6px}
.panel-h{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-h.sm{font-size:13px;margin:12px 0 6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.kpi b{font-size:22px;color:var(--pri);display:block;line-height:1.1}.kpi span{font-size:11.5px;color:var(--mut)}
.kpi.pulse{animation:pulse .6s}@keyframes pulse{50%{background:#fff4c2}}
.ratio{font-size:12.5px;margin:8px 0;line-height:1.55;background:#f6f9fc;border-radius:8px;padding:6px 8px}.ratio .r{color:var(--acc)}.ratio .small{color:var(--mut);font-size:12px}.warn{color:var(--bad)}
.prog{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--mut)}.bar{flex:1;height:6px;background:#e5ebf1;border-radius:9px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc))}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row.btns button{flex:1}.row.sw{justify-content:space-between}
.sl input{flex:1}.sl em{font-style:normal;width:42px;text-align:right;color:var(--mut)}
.tog{width:44px;height:24px;border-radius:999px;padding:0;position:relative;background:#cfd8e2;border:0}.tog i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--ok)}.tog.on i{left:23px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;border-radius:0;padding:4px 12px}.seg button.on{background:var(--pri);color:#fff}
select,textarea{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
textarea{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px;resize:vertical}
.lab{font-size:12px;color:var(--mut);display:block;margin:6px 0 3px}
.strands{font-size:12px}.sr{display:flex;gap:4px;align-items:flex-start;margin:3px 0}.sr em{font-style:normal;color:var(--mut);white-space:nowrap;font-size:11px;padding-top:2px}
.sr code{font:700 12.5px/1.5 ui-monospace,Consolas,monospace;word-break:break-all;flex:1}.sr code i{font-style:normal}.sr code i.dim{opacity:.45}
.cod{margin-right:4px;border-bottom:2px solid #c5ced8}
.aas{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin:5px 0}.aa{background:var(--c);color:#fff;border-radius:999px;padding:1px 7px;font-size:11.5px;text-shadow:0 1px 1px rgba(0,0,0,.3)}.aa.stop{background:#555}.aas b{color:#aaa}
.note{color:var(--mut);font-size:11.5px}
#foot{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:6px 10px}
#foot button{padding:8px 18px;font-weight:700}#navTxt{font-weight:700;min-width:170px;text-align:center}
.credit{margin-left:auto;font-size:11.5px;color:var(--mut);text-align:right}
#derive{position:fixed;left:50%;top:132px;transform:translateX(-50%) translateY(-16px);z-index:6;background:rgba(255,255,255,.95);border:2px solid var(--acc);border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;max-width:min(640px,calc(100% - 20px))}
#derive.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.dq{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dq .big{font-size:20px;font-family:ui-monospace,Consolas,monospace}.streak{color:var(--ok);font-size:12px;margin-left:auto}
.opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.nt{width:56px;height:46px;font-size:24px;font-weight:800;color:#fff;background:var(--c);border:3px solid transparent;border-radius:12px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.trna{min-width:116px;font:700 15px ui-monospace,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff8ec;border:2px solid #f0a23a}.trna small{font:400 11px var(--font);color:var(--mut)}.trna i{font-style:normal}
.trna.stopb{background:#f4f4f4;border-color:#999;font-family:var(--font);font-size:13px}
.right{outline:3px solid var(--ok);outline-offset:2px}.wrong{outline:3px solid var(--bad);outline-offset:2px;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{margin-top:6px;font-size:13.5px;min-height:20px}
#derivePrompt{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:5;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:700;box-shadow:0 6px 18px rgba(210,79,143,.35);display:none}
#derivePrompt.show{display:block}
#toast{position:fixed;left:50%;top:140px;transform:translateX(-50%);z-index:9;background:#1d2633;color:#fff;border-radius:10px;padding:8px 16px;opacity:0;transition:.25s;pointer-events:none}#toast.show{opacity:.95}
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-content:center;text-align:center;font-size:18px;gap:8px;transition:opacity .5s}#boot small{color:var(--mut);font-size:12px}#boot.gone{opacity:0;pointer-events:none}
@media (max-width:1180px){:root{--lw:272px;--rw:256px}.brand{min-width:0}.sub{display:none}.cc span{display:none}#left p,#left li{font-size:13px}.credit{font-size:10.5px;max-width:300px}}
@media (max-width:900px){
 .only-narrow{display:inline-block}.chain{display:none}.mq{font-size:12px}.brand .ttl{font-size:15px}
 #steps{top:auto;bottom:66px}
 aside{top:72px;bottom:66px;transition:transform .25s;width:min(360px,88vw)!important}
 #left{transform:translateX(-110%)}#right{transform:translateX(110%)}
 body.open-left #left,body.open-right #right{transform:none}
 #derivePrompt{bottom:112px}#derive{top:80px}.credit{display:none}#navTxt{min-width:0;flex:1}
}

/* —— 学生推导：拖动搭建 —— */
#derive{max-width:min(720px,calc(100% - 24px));max-height:calc(100vh - 160px);overflow:auto}
#derive .build{margin:8px 0;padding:8px;background:#f7fafc;border-radius:12px;border:1px dashed #c5d0db}
#derive .lane{display:flex;align-items:center;gap:8px;margin:4px 0}
#derive .lane-lab{width:64px;font-size:12px;color:var(--mut);text-align:right;line-height:1.25;flex-shrink:0}
#derive .lane-lab small{font-size:10px}
#derive .slots{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-height:52px;align-items:center}
#derive .slot{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;border:2px dashed #b7c4d3;background:#fff;color:#1d2633;user-select:none;touch-action:none}
#derive .slot.empty{color:#9aa7b5}
#derive .slot.filled,#derive .chip-nt{background:var(--c);color:#fff;border-style:solid;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.3);cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#derive .slot.locked{cursor:default;opacity:.95}
#derive .slot.drop-over{outline:3px solid var(--acc);outline-offset:2px;background:#ffeaf3}
#derive .slot.focus{outline:3px solid #ffd400;outline-offset:2px}
#derive .slot.big{width:auto;min-width:140px;height:64px;padding:0 14px;font-size:14px}
#derive .slot.trna-slot,#derive .slot.stop-slot{width:auto;min-width:150px;height:64px;padding:6px 12px;background:#fff8ec;color:#1d2633;border:2px solid #f0a23a;text-shadow:none;display:flex;flex-direction:column;gap:2px}
#derive .slot.stop-slot{background:#f4f4f4;border-color:#999}
#derive .pair-hint{text-align:center;color:var(--mut);font-size:12px;margin:2px 0}
#derive .palette-lab{font-size:12px;color:var(--mut);margin:6px 0 4px}
#derive .palette{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#eef3f8;border-radius:12px;min-height:56px}
#derive .chip-nt{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;position:relative;touch-action:none}
#derive .chip-nt em{position:absolute;bottom:-2px;right:-2px;font-style:normal;font-size:9px;background:#1d2633;color:#fff;border-radius:6px;padding:0 4px}
#derive .palette.trna{gap:6px}
#derive .chip-trna{min-width:120px;padding:6px 10px;border-radius:12px;background:#fff8ec;border:2px solid #f0a23a;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;cursor:grab;touch-action:none;user-select:none}
#derive .chip-trna small{font-weight:400;font-size:11px;color:var(--mut)}
#derive .chip-trna.stopb{background:#f4f4f4;border-color:#999}
#derive .chip-trna i,#derive .codon-card i{font-style:normal}
#derive .dacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#derive .dacts .pri:disabled{opacity:.45;cursor:not-allowed}
#derive .tip{color:var(--mut);font-size:12.5px}
#derive .okmsg{color:var(--ok)}
#derive .coach-h{color:#8e44ad}
#derive .coach-q{font-size:15px;font-weight:700;line-height:1.5;margin:6px 0;padding:8px 10px;background:#f6f0fb;border-radius:10px;border-left:4px solid #8e44ad}
#derive .coach-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#derive .coach-c{text-align:left;padding:8px 12px}
#derive .keybox{margin-top:8px;padding:8px 10px;background:#e3f6ea;border-radius:10px;border:1px solid var(--ok);font-size:14px}
#derive .keybox .kb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:#fff;font-weight:800;font-size:12px;margin:0 2px}
#derive .keybox .small{margin-top:4px;color:var(--mut);font-size:12px}
#derive .mini{margin-top:8px}
#derive .mini .slot{width:36px;height:36px;font-size:14px}
#derive .codon-card{text-align:center;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line);margin-bottom:8px}
#derive .codon-card .big{font-size:22px;font-family:ui-monospace,Consolas,monospace}
#derive .badge-stop{display:inline-block;margin-top:4px;background:var(--bad);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px}
#derive .aa-hint{font-size:12px;color:var(--mut);margin-top:4px}
#derive .build.tl{display:flex;flex-direction:column;align-items:center}
.drag-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;min-width:56px;height:56px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--c,#888);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.lt.draft{outline:2px dashed #fff;opacity:.95}
button.ghost{background:transparent}

/* —— 课堂分步 / 先想一想 / 结论条（沿用初稿气质） —— */
#derive,#derivePrompt{display:none!important}
#banner{position:fixed;left:50%;top:136px;transform:translateX(-50%);z-index:5;padding:7px 18px;border-radius:999px;font-weight:800;font-size:15px;background:rgba(255,255,255,.82);color:#8a94a0;border:2px solid #c5d0db;pointer-events:none;box-shadow:0 4px 14px rgba(20,40,60,.08);max-width:min(640px,calc(100% - 40px));text-align:center;letter-spacing:.02em}
#banner.on{background:#e3f6ea;color:#1f7a43;border-color:var(--ok);box-shadow:0 4px 16px rgba(47,163,90,.25)}
#caption{position:fixed;left:50%;bottom:158px;transform:translateX(-50%);z-index:5;max-width:min(720px,calc(100% - 40px));background:rgba(29,38,51,.86);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;line-height:1.55;text-align:center;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#legend{position:fixed;right:calc(var(--rw) + 24px);top:148px;z-index:5;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.6;box-shadow:0 6px 16px rgba(20,40,60,.1);min-width:168px}
#legend b{display:block;margin-bottom:4px;font-size:13px}
#legend .lg{display:flex;align-items:center;gap:8px;margin:3px 0}
#legend .lg i{display:inline-block;width:28px;height:0;border-top:3px solid #2f62b0;font-style:normal}
#legend .lg i.dash{border-top-style:dashed;border-color:#2f7fd8;width:28px}
#legend .lg i.solid{border-top-style:solid;border-color:#1d2633;width:28px}
#classBar{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:7px 10px;box-shadow:0 8px 24px rgba(20,40,60,.14);max-width:min(820px,calc(100% - var(--lw) - var(--rw) - 28px))}
#classBar .cb-lab{font-weight:800;font-size:12px;color:var(--pri);background:#e8f0fb;border-radius:999px;padding:3px 8px;white-space:nowrap}
#classBar .cb-subs{display:flex;flex-wrap:wrap;gap:4px}
#classBar .schip{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.9)}
#classBar .schip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#classBar .cb-nav{display:flex;gap:6px}
#classBar .cb-nav button{font-weight:700;padding:6px 12px}
#classBar .cb-extra{display:flex;align-items:center;gap:6px}
#classBar .cb-contrast{display:flex;align-items:center;gap:6px;padding-left:6px;border-left:1px solid var(--line)}
#classBar .cb-contrast span{font-size:12.5px;color:var(--mut);white-space:nowrap}
#think{position:fixed;left:auto;right:8px;top:56px;bottom:auto;transform:none;z-index:8;width:min(340px,calc(100% - 20px));max-height:min(36vh,300px);overflow:auto;background:rgba(255,255,255,.96);border:2px solid var(--acc);border-radius:16px;padding:8px 12px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
#think.dragged{transform:none;bottom:auto;right:auto}
#think.think-min{width:auto;max-width:none;max-height:none;overflow:visible;padding:4px 6px;right:auto}
#think.think-min .th-body,#think.think-min .th-draghint,#think.think-min #thMin{display:none}
#think.think-min .th-head{margin:0;padding:4px 6px}
#think .th-head{display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 0 8px;padding:2px 0 6px}
#think .th-head:active{cursor:grabbing}
#think .th-kicker{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;margin:0;pointer-events:none}
#think .th-draghint{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}
#think .th-q{font-size:14px;font-weight:700;line-height:1.5;margin:0 0 8px}
#think .th-item{margin:8px 0}
#think .th-item .prompt{font-size:13px;color:var(--mut);margin-bottom:4px}
#think .th-opts{display:flex;flex-direction:column;gap:6px}
#think .th-opt{text-align:left;padding:8px 12px;line-height:1.45}
#think .th-opt.pick{border-color:var(--pri);background:#e8f0fb}
#think .th-opt.right{background:#e3f6ea;border-color:var(--ok)}
#think .th-opt.wrong{background:#fde8e5;border-color:var(--bad)}
#think .th-ans{margin-top:8px;padding:8px 10px;background:#f6f9fc;border-radius:10px;font-size:13.5px;line-height:1.55}
#think .th-acts{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
#hint{position:fixed;left:50%;top:136px;transform:translateX(-50%);z-index:5;background:#fff7e6;border:1.5px solid #f39c3d;color:#8a4a00;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(20,40,60,.1);max-width:min(640px,calc(100% - 40px));text-align:center}
@media (max-width:1180px){
  #legend{right:calc(var(--rw) + 16px);top:140px;font-size:12px}
  #caption{font-size:13px;bottom:124px}
  #classBar{max-width:calc(100% - 20px)}
}
@media (max-width:900px){
  #banner{top:76px;font-size:13px;padding:5px 12px}
  #caption{bottom:168px;font-size:12.5px}
  #classBar{bottom:110px;padding:6px 8px}
  #legend{right:10px;top:auto;bottom:auto;left:auto;display:none}
  body.open-right #legend{display:none}
  #hint{top:76px;font-size:12px}
}

/* —— 学案作答 —— */
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg.mode{flex-shrink:0}.seg.mode button{padding:5px 10px;font-size:13px;font-weight:700}
#xuean{position:fixed;top:136px;bottom:74px;left:10px;width:var(--lw);z-index:4;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 6px 24px rgba(20,40,60,.1);padding:12px 14px;display:none}
body.xuean-on{--lw:min(460px,44vw)}
body.xuean-on #left{display:none}
body.xuean-on #xuean{display:block}
body.xuean-on #banner,body.xuean-on #hint{display:none}
.xa-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.xa-h1{font-weight:800;font-size:16px}
.xa-h2{font-size:12px;color:var(--mut);flex:1}
.xa-teach{font-size:12px;padding:2px 8px;border-radius:999px}
body.xa-teacher .xa-teach{background:#8e44ad;color:#fff;border-color:#8e44ad}
.xa-tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;position:sticky;top:-12px;background:var(--card);padding:6px 0;z-index:1}
.xa-tab{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
.xa-tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.xa-kicker{font-weight:800;color:var(--pri);margin:0 0 6px}
.xa-drive{background:#ffeaf3;border-radius:10px;padding:8px 10px;line-height:1.55;font-size:14px}
.xa-drive b{background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px;font-size:12px}
.xa-p,.xa-note{font-size:13.5px;line-height:1.6;margin:6px 0}
.xa-note{color:var(--mut);font-size:12.5px}
.xa-grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#xuean label{display:block;margin:8px 0 4px;font-size:13px;color:var(--ink)}
#xuean input,#xuean textarea{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
#xuean .xa-block{margin:10px 0;padding:10px;background:rgba(255,255,255,.75);border-radius:12px;border-left:4px solid #c5d0db}
#xuean .xa-block h4{margin:0 0 6px;font-size:14px}
.xa-item{margin:8px 0;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.xa-q{font-size:13.5px;line-height:1.5;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.xa-q i{font-style:normal;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e8f0fb;color:var(--pri);display:grid;place-items:center;font-size:12px;font-weight:800}
.xa-badge{margin-left:auto;font-size:11px;color:var(--mut);background:#f0f3f7;border-radius:999px;padding:1px 7px;white-space:nowrap}
.xa-j{padding:4px 10px;border-radius:999px;font-size:13px}
.xa-j.pick{background:var(--pri);color:#fff;border-color:var(--pri)}
.xa-rev{margin-top:6px;font-size:12.5px;color:var(--mut)}
.xa-scroll{overflow:auto;margin:8px 0}
table.xa-cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
table.xa-cmp th,table.xa-cmp td{border:1px solid var(--line);padding:6px;vertical-align:top;background:#fff}
table.xa-cmp th{background:#f6f9fc;font-weight:700}
table.codon-tbl{border-collapse:collapse;width:100%;font-size:11.5px;margin-top:6px}
table.codon-tbl th,table.codon-tbl td{border:1px solid var(--line);padding:3px 4px;text-align:left}
table.codon-tbl th{background:#e8f0fb}
table.codon-tbl code{font-weight:800;margin-right:2px}
.codon-note{font-size:12px;color:var(--mut)}
.xa-ref{margin-top:6px;padding:6px 8px;background:#e3f6ea;border-radius:8px;font-size:12.5px;line-height:1.55;color:#1f7a43}
.xa-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;padding:6px;background:#f7fafc;border-radius:10px;border:1px dashed #c5d0db}
.xa-flow .slot{min-width:88px;width:auto;height:auto;padding:8px 10px;font-size:13px}
.xa-chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:10px;background:#fff;border:1.5px solid var(--pri);font-weight:700;font-size:13px;cursor:grab;touch-action:none;user-select:none}
.xa-chip.locked{cursor:default;background:#e8f0fb}
.xa-chip.pick{outline:3px solid var(--acc)}
.xa-fork{display:flex;justify-content:center;margin-bottom:8px}
.xa-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xa-cols h4{color:var(--ok)}
.xa-cols > div:last-child h4{color:#c0392b}
.xa-ticks{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:13px}
.xa-codon-btn{width:100%;margin-top:8px}
.xa-vhl.pick{border-color:var(--pri);background:#e8f0fb}
#xuean .opt{display:block;width:100%;text-align:left;margin:4px 0;line-height:1.45}
#xuean .dacts{margin-top:8px}
@media (max-width:1180px){body.xuean-on{--lw:min(400px,46vw)}}
@media (max-width:900px){
  body.xuean-on{--lw:min(360px,88vw)}
  #xuean{top:72px;bottom:66px;width:min(360px,88vw)!important;transform:translateX(-110%);transition:transform .25s;display:block}
  body.xuean-on:not(.open-left) #xuean{transform:translateX(-110%)}
  body.xuean-on.open-left #xuean{transform:none}
  .xa-cols{grid-template-columns:1fr}
  .seg.mode button{padding:4px 7px;font-size:12px}
}

#classBar[hidden],#caption[hidden],#banner[hidden],#legend[hidden],#think[hidden],#hint[hidden],#derive[hidden],#xuean[hidden]{display:none!important}
body.xuean-on #xuean{bottom:128px}
@media (max-width:900px){body.xuean-on #xuean{bottom:168px}}

/* —— 课前自测（扫码进入后，先于 3D 课件） —— */
body.pretest-on{overflow:auto}
#pretest{position:fixed;inset:0;z-index:22;background:#e8eef3;overflow:auto;-webkit-overflow-scrolling:touch}
#pretest .pt-card{max-width:860px;margin:0 auto;padding:20px 18px 40px}
#pretest .pt-kicker{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
#pretest h1{margin:0 0 10px;font-size:22px;line-height:1.35}
#pretest .pt-lead{margin:0 0 16px;font-size:15px;line-height:1.65;color:#2a3440}
#pretest .pt-list{display:flex;flex-direction:column;gap:10px}
#pretest .pt-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px rgba(20,40,60,.06)}
#pretest .pt-q{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.55;font-weight:700;margin-bottom:10px}
#pretest .pt-q i{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#e8f0fb;color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:14px;margin-top:1px}
#pretest .pt-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pretest .pt-opt{min-height:48px;font-size:16px;font-weight:800;border-radius:12px;padding:8px 10px}
#pretest .pt-opt.pick{background:var(--pri);color:#fff;border-color:var(--pri)}
#pretest .pt-prog{margin:14px 0 8px;color:var(--mut);font-size:14px}
#pretest .pt-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#pretest .pt-acts .pri{min-height:48px;padding:10px 22px;font-size:16px}
#pretest .pt-acts .pri:disabled{opacity:.45;cursor:not-allowed}
#pretest .pt-acts .ghost{min-height:48px}
@media (max-width:600px){
  #pretest h1{font-size:19px}
  #pretest .pt-q{font-size:15px}
}

/* —— 可隐藏的顶栏 / 课堂分步 / 底栏 —— */
#top,#steps,#foot,#classBar,#caption{transition:opacity .2s,transform .25s,visibility .25s}
body.hide-top #top,body.hide-top #steps{opacity:0;visibility:hidden;pointer-events:none}
body.hide-foot #foot{transform:translateY(140%);opacity:0;pointer-events:none;visibility:hidden}
body.hide-class #classBar{transform:translateX(-50%) translateY(160%);opacity:0;pointer-events:none;visibility:hidden}
body.hide-class #caption{opacity:0;visibility:hidden;pointer-events:none}
body.hide-top aside{top:56px}
body.hide-foot aside,body.hide-class aside{bottom:16px}
body.hide-top #toast{top:58px}

#chromeTabs{pointer-events:none}
body.pretest-on #chromeTabs{display:none}
.tabs-dock{position:fixed;z-index:7;display:flex;gap:8px;pointer-events:none}
.tabs-dock.top{top:10px;left:10px}
.tabs-dock.bottom{left:10px;right:10px;bottom:10px;justify-content:space-between}
.chrome-tab{pointer-events:auto;min-height:44px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(20,40,60,.16)}
#tabsTopDock{display:none}
body.hide-top #tabsTopDock{display:flex}
#tabClass,#tabFoot{display:none}
body.hide-class #tabClass{display:inline-flex;align-items:center}
body.hide-foot #tabFoot{display:inline-flex;align-items:center}
/* 无课堂分步时不显示该页签（由 JS 再加 no-lesson） */
body.no-lesson #tabClass{display:none}

#foot{transition:transform .25s,opacity .25s,visibility .25s}
#btnHideTop,#btnHideFoot{flex-shrink:0}
@media (max-width:1200px){
  #think{width:min(320px,calc(100% - 16px));max-height:min(34vh,260px);font-size:13px}
  #think .th-q{font-size:13.5px}
  #think .th-opt{padding:7px 10px}
}

/* —— 课前自诊对照结果 —— */
#pretest .pt-res{padding:14px 16px}
#pretest .pt-res.ok{border-left:5px solid var(--ok);background:#f3fbf6}
#pretest .pt-res.miss{border-left:5px solid var(--bad);background:#fdf6f5}
#pretest .pt-res.partial{border-left:5px solid #e0a106;background:#fff9e8}
#pretest .pt-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px 38px}
#pretest .pt-chip{display:inline-block;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:800;background:#fff;border:1px solid var(--line)}
#pretest .pt-chip.key{background:#e8f0fb;border-color:#b7c9e3;color:var(--pri)}
#pretest .pt-chip.mark.ok{background:#e3f6ea;border-color:var(--ok);color:#1f7a43}
#pretest .pt-chip.mark.miss{background:#fde8e5;border-color:var(--bad);color:var(--bad)}
#pretest .pt-chip.mark.partial{background:#fff3cd;border-color:#e0a106;color:#8a5a00}
#pretest .pt-note{margin:0 0 8px 38px;font-size:14px;line-height:1.55;color:#5b3b10}
#pretest .pt-point{margin:0 0 0 38px;background:rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
#pretest .pt-point-h{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:4px}
#pretest .pt-point p{margin:0;font-size:15.5px;line-height:1.7;font-weight:600;color:#1d2633}
#pretest .pt-acts-sticky{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(232,238,243,0),#e8eef3 18px);padding:16px 0 8px;margin-top:8px}
@media (max-width:600px){
  #pretest .pt-row,#pretest .pt-note,#pretest .pt-point{margin-left:0}
  #pretest .pt-point p{font-size:15px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<header id="top"></header>
<nav id="steps"></nav>
<aside id="left"></aside>
<aside id="xuean" hidden></aside>
<aside id="right"></aside>
<div id="derive" hidden></div>
<button id="derivePrompt" hidden>学生推导</button>
<div id="hint" hidden></div>
<div id="banner" hidden></div>
<div id="caption" hidden></div>
<div id="legend" hidden></div>
<div id="classBar" hidden></div>
<div id="think" hidden></div>

  </div>

    <button type="button" id="tabClass" class="chrome-tab">课堂分步</button>

</div>

</footer>
<div id="toast"></div>
<div id="pretest" hidden></div>
