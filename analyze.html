.xa-p,.xa-note{font-size:13.5px;line-height:1.6;margin:6px 0}

.xa-q{font-size:13.5px;line-height:1.5;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.xa-q i{font-style:normal;flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e8f0fb;color:var(--pri);display:grid;place-items:center;font-size:12px;font-weight:800}
.xa-badge{margin-left:auto;font-size:11px;color:var(--mut);background:#f0f3f7;border-radius:999px;padding:1px 7px;white-space:nowrap}
.xa-j{padding:4px 10px;border-radius:999px;font-size:13px}
.xa-j.pick{background:var(--pri);color:#fff;border-color:var(--pri)}
.xa-rev{margin-top:6px;font-size:12.5px;color:var(--mut)}
.xa-scroll{overflow:auto;margin:8px 0}

table.codon-tbl th,table.codon-tbl td{border:1px solid var(--line);padding:3px 4px;text-align:left}
table.codon-tbl th{background:#e8f0fb}
table.codon-tbl code{font-weight:800;margin-right:2px}
.codon-note{font-size:12px;color:var(--mut)}
.xa-ref{margin-top:6px;padding:6px 8px;background:#e3f6ea;border-radius:8px;font-size:12.5px;line-height:1.55;color:#1f7a43}
.xa-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;padding:6px;background:#f7fafc;border-radius:10px;border:1px dashed #c5d0db}

.xa-fork{display:flex;justify-content:center;margin-bottom:8px}
.xa-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xa-cols h4{color:var(--ok)}
.xa-cols > div:last-child h4{color:#c0392b}
.xa-ticks{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:13px}
.xa-codon-btn{width:100%;margin-top:8px}
.xa-vhl.pick{border-color:var(--pri);background:#e8f0fb}
#xuean .opt{display:block;width:100%;text-align:left;margin:4px 0;line-height:1.45}
#xuean .dacts{margin-top:8px}
@media (max-width:1180px){body.xuean-on{--lw:min(400px,46vw)}}

  body.xuean-on{--lw:min(360px,88vw)}

  body.xuean-on:not(.open-left) #xuean{transform:translateX(-110%)!important}
  body.xuean-on.open-left:not(.hide-left) #xuean{transform:none}

#classBar[hidden],#caption[hidden],#banner[hidden],#legend[hidden],#think[hidden],#hint[hidden],#derive[hidden],#xuean[hidden],#qCue[hidden],#examLinks[hidden]{display:none!important}

/* —— 课前自测（扫码进入后，先于 3D 课件） —— */
body.pretest-on{overflow:auto}

#pretest .pt-card{max-width:960px;margin:0 auto;padding:20px 18px 40px}
#pretest .pt-kicker{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
#pretest h1{margin:0 0 10px;font-size:22px;line-height:1.35}
#pretest .pt-score{margin:4px 0 14px;padding:12px 16px;border-radius:14px;background:#e8f0fb;border:1.5px solid #9bb8e8;font-size:20px;font-weight:800;color:#16325c;text-align:center;letter-spacing:.02em}

#pretest .pt-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px rgba(20,40,60,.06)}

#pretest .pt-q i{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#e8f0fb;color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:14px;margin-top:1px}
#pretest .pt-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

#pretest .pt-opt.pick{background:var(--pri);color:#fff;border-color:var(--pri)}
#pretest .pt-why-h{font-size:13px;font-weight:800;color:#355a4a;margin:12px 0 8px;letter-spacing:.04em}
#pretest .pt-whys{display:grid;gap:8px}
#pretest .pt-why{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;line-height:1.55;font-weight:600;color:#1d2633;cursor:pointer}
#pretest .pt-why i{flex:0 0 24px;height:24px;border-radius:50%;background:#e8f0fb;color:var(--pri);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px}
#pretest .pt-why:hover{border-color:#9bb8d9;background:#f5f9fd}
#pretest .pt-why.pick{border-color:var(--pri);background:#e8f0fb;box-shadow:inset 0 0 0 1px var(--pri)}
#pretest .pt-why.pick i{background:var(--pri);color:#fff}
#pretest .pt-prog{margin:14px 0 8px;color:var(--mut);font-size:14px}
#pretest .pt-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#pretest .pt-acts .pri{min-height:48px;padding:10px 22px;font-size:16px}
#pretest .pt-acts .pri:disabled{opacity:.45;cursor:not-allowed}
#pretest .pt-acts .ghost{min-height:48px}
@media (max-width:600px){
  #pretest h1{font-size:19px}
  #pretest .pt-q{font-size:15px}
}

/* —— 可隐藏的顶栏 / 课堂分步 / 底栏 —— */
#top,#steps,#foot,#classBar,#caption{transition:opacity .2s,transform .25s,visibility .25s}
body.hide-top #top,body.hide-top #steps{opacity:0;visibility:hidden;pointer-events:none}
body.hide-foot #foot{transform:translateY(140%);opacity:0;pointer-events:none;visibility:hidden}
body.hide-class #classBar{transform:translateX(-50%) translateY(160%);opacity:0;pointer-events:none;visibility:hidden}
body.hide-class #caption{opacity:0;visibility:hidden;pointer-events:none}
body.model-on #classBar,body.model-on #foot,body.model-on #caption{transform:none;opacity:0;pointer-events:none;visibility:hidden}
body.model-on #tabClass,body.model-on #tabFoot{display:none}
body.model-on #pageCredit{bottom:var(--model-h,280px);right:14px}
body.model-on aside{bottom:16px}
body.hide-top aside{top:56px}
body.hide-foot aside,body.hide-class aside{bottom:16px}
body.hide-top #toast{top:58px}

#chromeTabs{pointer-events:none}
body.pretest-on #chromeTabs,body.pretest-on #model{display:none}
.tabs-dock{position:fixed;z-index:7;display:flex;gap:8px;pointer-events:none}
.tabs-dock.top{top:calc(10px + var(--sat));left:calc(10px + var(--sal))}
.tabs-dock.bottom{left:calc(10px + var(--sal));bottom:calc(10px + var(--sab));justify-content:flex-start;flex-wrap:wrap}
.chrome-tab{pointer-events:auto;min-height:44px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(20,40,60,.16)}
#tabsTopDock{display:none}
body.hide-top #tabsTopDock{display:flex}
#tabClass,#tabFoot{display:none}
body.hide-class #tabClass{display:inline-flex;align-items:center}
body.hide-foot #tabFoot{display:inline-flex;align-items:center}
body.model-on #tabClass,body.model-on #tabFoot{display:none !important}
/* 无课堂分步时不显示该页签（由 JS 再加 no-lesson） */
body.no-lesson #tabClass{display:none}

#foot{transition:transform .25s,opacity .25s,visibility .25s}
#btnHideTop,#btnHideFoot{flex-shrink:0}
@media (max-width:1200px){
  #think{width:min(320px,calc(100% - 16px));max-height:min(34vh,260px);font-size:13px}
  #think .th-q{font-size:13.5px}

}

/* —— 课前自诊对照结果 —— */

#pretest .pt-cmp-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin:0 0 20px;box-shadow:0 4px 14px rgba(20,40,60,.06)}

#pretest .pt-cmp-title{margin:0 0 8px;font-size:18px;line-height:1.35;color:#215227}
#pretest .pt-cmp-lead{margin:0 0 10px;font-size:14px;line-height:1.6;color:#2a3440}
#pretest .pt-cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:0 0 10px}
#pretest table.pt-cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;line-height:1.45}
#pretest table.pt-cmp th,#pretest table.pt-cmp td{border:1px solid #c5d4b3;padding:6px;vertical-align:top;background:#fff}
#pretest table.pt-cmp thead th{background:#3d6b2f;color:#fff;font-weight:800;text-align:center;font-size:14px;padding:8px 6px}
#pretest table.pt-cmp tbody th{background:#e7f0dc;color:#1d3320;font-weight:800;text-align:center;width:5.5em;white-space:nowrap}
#pretest .pt-slot{min-height:52px;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.45;position:relative}

#pretest .pt-slot.open{outline:3px solid var(--acc);outline-offset:1px}
#pretest .pt-slot-pick{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin:0;border:0;background:transparent;color:#5a7a48;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;border-radius:8px;padding:8px;-webkit-appearance:none;appearance:none}
#pretest .pt-slot-val{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0;margin:0;line-height:1.45;overflow-wrap:anywhere;word-break:break-word;-webkit-appearance:none;appearance:none}
#pretest .pt-slot-x{position:absolute;top:2px;right:2px;z-index:1;width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:#8a5a4a;font-size:16px;line-height:1;cursor:pointer;padding:0}
#pretest .pt-slot-x:hover{background:#fde8e5;color:var(--bad)}
#pretest .pt-cmp-prog{font-size:13px;font-weight:800;color:#355a4a;margin:4px 0 0}
#ptPickPanel{position:fixed;z-index:40;box-sizing:border-box;background:#fff;border:1.5px solid #3d6b2f;border-radius:12px;box-shadow:0 10px 32px rgba(20,40,60,.2);padding:6px;max-height:min(60vh,400px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ptPickPanel .pt-pick-opt{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;text-align:left;min-height:36px;padding:8px 10px;margin:0 0 4px;border:1.5px solid #c5d4b3;border-radius:8px;background:#f7fbf3;color:#215227;font-family:inherit;font-weight:700;font-size:13px;line-height:1.45;cursor:pointer;overflow-wrap:anywhere;word-break:break-word;-webkit-appearance:none;appearance:none}
#ptPickPanel .pt-pick-opt:last-child{margin-bottom:0}
#ptPickPanel .pt-pick-opt.cur{border-color:#3d6b2f;background:#eef8e8;box-shadow:inset 0 0 0 1px #3d6b2f}
#ptPickPanel .pt-pick-opt.used,#ptPickPanel .pt-pick-opt:disabled{cursor:not-allowed;background:#f3f3f3;border-color:#d8d8d8;color:#6a6a6a;box-shadow:none}
#ptPickPanel .pt-pick-txt{flex:1;min-width:0}
#ptPickPanel .pt-pick-tag{flex:0 0 auto;margin-top:2px;padding:1px 6px;border-radius:999px;background:#e8e8e8;color:#5a5a5a;font-size:11px;font-weight:800;white-space:nowrap}
#pretest table.pt-cmp.key td.pt-cmp-ok{background:#f3fbf6}
#pretest table.pt-cmp.key td.pt-cmp-miss{background:#fdf6f5}
#pretest table.pt-cmp.key td.hl .pt-cmp-key{background:#fff04a;display:inline;padding:0 2px;border-radius:2px}
#pretest .pt-cmp-you{font-size:11.5px;color:#7a4a16;font-weight:700;margin-bottom:4px}
#pretest .pt-cmp-you.mut{color:#8a959e;font-weight:600}
#pretest .pt-cmp-key{color:#9a2d1f;font-weight:700;font-size:12.5px;line-height:1.45}
#pretest .pt-res{padding:14px 16px}

#pretest .pt-res.partial{border-left:5px solid #e0a106;background:#fff9e8}
#pretest .pt-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px 38px}
#pretest .pt-chip{display:inline-block;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:800;background:#fff;border:1px solid var(--line)}
#pretest .pt-chip.key{background:#e8f0fb;border-color:#b7c9e3;color:var(--pri)}
#pretest .pt-chip.mark.ok{background:#e3f6ea;border-color:var(--ok);color:#1f7a43}
#pretest .pt-chip.mark.miss{background:#fde8e5;border-color:var(--bad);color:var(--bad)}
#pretest .pt-chip.mark.partial{background:#fff3cd;border-color:#e0a106;color:#8a5a00}
#pretest .pt-note{margin:0 0 8px 38px;font-size:14px;line-height:1.55;color:#5b3b10}
#pretest .pt-point{margin:0 0 0 38px;background:rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}

/* —— 建构模型 —— */
#model{position:fixed;left:10px;right:10px;bottom:8px;top:auto;transform:none;z-index:12;width:auto;max-height:min(74vh,calc(100% - 52px));overflow:hidden;background:rgba(255,255,255,.97);border:2px solid var(--pri);border-radius:16px 16px 12px 12px;box-shadow:0 -10px 36px rgba(20,40,60,.2);display:none}
#model.show{display:flex;flex-direction:column}
#model.dragged{left:auto;right:auto;bottom:auto;transform:none}
#model.md-full{left:8px;right:8px;top:8px;bottom:8px;max-height:none;height:auto;border-radius:16px;box-shadow:0 16px 48px rgba(20,40,60,.28);z-index:20}
#model.md-full .md-draghint{flex:1 1 auto;min-width:8em;white-space:normal;overflow:visible;text-overflow:clip}
#model.md-full #mdFull,#model #mdFull{min-height:36px;padding:6px 12px;font-weight:800}
#model.md-full .md-lane.ok,#model.md-full .md-lane.bad{min-height:0;padding:8px 8px 10px;margin-top:6px}
#model.md-full .md-board{padding-bottom:4px;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
#model.md-full .md-slot{min-width:120px;flex:0 0 120px}
#model.md-full .md-arrow-col{flex:0 0 108px;width:108px;min-width:108px}
#model.md-full .md-card{font-size:16px;padding:12px 16px;min-height:52px}
#model.md-full .md-lead{font-size:16px;line-height:1.5}

body.model-full #top,body.model-full #steps,body.model-full #classBar,body.model-full #foot,body.model-full #caption,body.model-full #banner,body.model-full #chromeTabs{opacity:0;visibility:hidden;pointer-events:none}
body.model-full #pageCredit{display:none}
#model.md-min{width:auto;max-width:none;max-height:none;overflow:visible;left:auto;right:12px;bottom:10px;top:auto;transform:none}
#model.md-min .md-body,#model.md-min .md-draghint,#model.md-min #mdMin,#model.md-min #mdFull,#model.md-min .md-switch{display:none}
#model.md-min .md-head{margin:0;padding:6px 8px}
#model .md-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:0 0 auto;cursor:default;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:8px 12px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.97);z-index:1}
#model .md-brand{display:flex;align-items:center;gap:6px}
#model .md-brand b{font-size:18px}
#model .md-no{background:var(--pri);color:#fff;border-radius:6px;padding:2px 9px;font-size:14px;font-weight:800}
#model .md-switch{display:flex;gap:4px}
#model .md-sw{padding:5px 12px;min-height:36px;border-radius:999px;font-weight:800;font-size:16px}
#model .md-sw.on{background:var(--pri);color:#fff;border-color:var(--pri)}

#model .md-body{padding:6px 14px 8px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}

/* —— t58 手机扫码（短边 ≤500，由 body.phone 标记；不改 1180/900 平板规则） —— */
body.phone{overflow:hidden}
body.phone #top{
  top:calc(6px + var(--sat));left:calc(6px + var(--sal));right:calc(6px + var(--sar));
  flex-wrap:wrap;align-items:flex-start;gap:4px 6px;padding:6px 8px;border-radius:12px;
}
body.phone .brand{max-width:none;flex:0 1 auto}
body.phone .logo{font-size:18px}

body.phone .tools{flex:1 1 auto;justify-content:flex-end;gap:3px;flex-wrap:wrap}
body.phone .tools .ghost,body.phone .seg.mode button{min-height:36px;padding:4px 7px;font-size:12px}
body.phone .lab-full{display:none}body.phone .lab-short{display:inline}
body.phone .mainline{flex:1 1 100%;order:3;overflow:visible;min-width:0}
body.phone .mq,body.phone .mq.mq-wrap{white-space:normal;overflow:visible;font-size:12px;line-height:1.4;font-weight:700}
body.phone .chain{display:none}
body.phone #steps{
  top:var(--steps-top,96px)!important;bottom:auto!important;
  left:calc(6px + var(--sal));right:calc(6px + var(--sar));

}

body.phone #foot{
  bottom:calc(6px + var(--sab));left:calc(6px + var(--sal));right:calc(6px + var(--sar));
  padding:4px 6px;gap:6px;
}

body.phone #navTxt{font-size:11px;min-width:0;flex:1;text-align:center}
body.phone #classBar{
  left:calc(6px + var(--sal));right:calc(6px + var(--sar));transform:none;

}

body.phone #caption{
  left:calc(6px + var(--sal));right:calc(6px + var(--sar));transform:none;
  bottom:calc(118px + var(--sab));max-width:none;text-align:left;
  font-size:12px;line-height:1.45;padding:6px 8px;max-height:4.8em;overflow:auto;-webkit-overflow-scrolling:touch;
}

body.phone.sec-view #caption{max-width:none;left:calc(6px + var(--sal));right:calc(6px + var(--sar));bottom:calc(118px + var(--sab))}
body.phone #secTitle{top:var(--steps-top,96px);left:calc(6px + var(--sal));font-size:13px;padding:3px 8px;margin-top:40px}
body.phone #pageCredit{right:calc(8px + var(--sar));bottom:calc(50px + var(--sab));font-size:9px;max-width:48vw;white-space:normal;line-height:1.25}
body.phone #think{

}
body.phone #think .th-q{font-size:14px}

body.phone #legend{font-size:12px;max-width:calc(100vw - 24px)}
body.phone #hint{top:auto;left:calc(8px + var(--sal));right:calc(8px + var(--sar));transform:none;max-width:none;font-size:12px;border-radius:12px}
body.phone #banner{left:calc(6px + var(--sal));right:calc(6px + var(--sar));top:calc(var(--steps-top,96px) + 40px);transform:none;font-size:12px;padding:4px 10px;white-space:normal;text-align:center}
body.phone aside,body.phone #xuean,body.phone #lessonSide{

}

body.phone #pretest .pt-cmp-lead{font-size:13px}
body.phone #pretest table.pt-cmp{min-width:560px;font-size:12px}
body.phone #pretest .pt-chip{font-size:12px;padding:6px 8px}
body.phone #pretest .pt-slot{min-height:46px;font-size:12px}
body.phone #pretest .pt-slot-pick{min-height:46px;font-size:12.5px}

body.phone #pretest .pt-card{padding:14px 12px calc(28px + var(--sab));max-width:none}
body.phone #pretest h1{font-size:18px}
body.phone #pretest .pt-score{font-size:18px;padding:10px 12px}

body.phone #pretest .pt-item,body.phone #pretest .pt-lead,body.phone #pretest .pt-q{overflow-wrap:anywhere;word-break:break-word}
body.phone #model.md-full{left:var(--sal);right:var(--sar);top:var(--sat);bottom:var(--sab);border-radius:0}
body.phone #model.md-full .md-lane.ok,body.phone #model.md-full .md-lane.bad{min-height:0;padding:8px}
body.phone #model .md-lead{font-size:15px;line-height:1.45}
body.phone #model .md-slot{min-width:100px;flex:0 0 100px;min-height:54px}
body.phone #model.md-full .md-slot{min-width:100px;flex:0 0 100px}
body.phone #model .md-arrow-col,body.phone #model.md-full .md-arrow-col{flex:0 0 84px;width:84px;min-width:84px}
body.phone #model .md-card{min-height:44px;font-size:15px}
body.phone #model .md-ph{font-size:14px}
body.phone #model .md-title{font-size:18px}
body.phone #model .md-kicker,body.phone #model .md-lane-h,body.phone #model .md-bank-h{font-size:14px}
body.phone #model .md-acts button{min-height:44px}

body.phone #toast{left:calc(8px + var(--sal));right:calc(8px + var(--sar));top:auto;bottom:calc(64px + var(--sab));transform:none;max-width:none;font-size:12px;text-align:center}

/* 手机横屏：再压低顶底栏，把 3D 留给中间 */
body.phone-land #top{padding:4px 6px;gap:3px 4px}
body.phone-land .brand .ttl{font-size:12px}

#analyzeModal .az-mask,#analyzeModal .az-dialog,#analyzeModal input{pointer-events:auto}
#analyzeModal input{-webkit-user-select:text;user-select:text;caret-color:#1d2633}
#analyzeView{position:fixed;inset:0;z-index:41;background:#e8eef3;overflow:auto;-webkit-overflow-scrolling:touch}
body.analyze-on,body.analyze-modal-on{overflow:auto}
body.analyze-on #toast,body.analyze-modal-on #toast{z-index:60}
.az-mask{position:absolute;inset:0;background:rgba(20,32,48,.38);display:flex;align-items:center;justify-content:center;padding:18px}
.az-dialog{width:min(420px,100%);background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 16px 40px rgba(20,40,60,.18);padding:20px 20px 16px}
.az-dialog h3{margin:0 0 8px;font-size:18px}
.az-field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-weight:700;font-size:13px;color:#16325c}
.az-field input{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:16px}
.az-field input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,98,176,.15)}
.az-err{margin:0 0 8px;color:var(--bad);font-weight:700;font-size:13px}
.az-dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.az-dlg-acts .pri,.az-dlg-acts .ghost{min-height:42px;padding:8px 16px}
.az-page{max-width:min(2400px,100%);margin:0 auto;padding:18px 24px 48px;box-sizing:border-box}
.az-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 16px;position:-webkit-sticky;position:sticky;top:0;z-index:5;background:#e8eef3;padding:12px 0 14px;border-bottom:1px solid rgba(20,40,60,.08)}
.az-kicker{color:var(--mut);font-size:16px;font-weight:700;letter-spacing:.04em}
.az-page h1{margin:2px 0 0;font-size:40px;line-height:1.25}
.az-updated{margin:6px 0 0;font-size:16px;color:var(--mut);font-weight:700}
.az-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.az-acts .pri,.az-acts .ghost{min-height:48px;padding:10px 18px;font-size:18px;font-weight:800}
.az-auto{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:#16325c;user-select:none;-webkit-user-select:none;min-height:48px;padding:0 14px;background:#fff;border:2px solid var(--pri);border-radius:12px}
.az-auto input{width:22px;height:22px;accent-color:var(--pri);flex-shrink:0}
.az-acts #azRefresh,.az-refresh-btn{border:2px solid var(--pri);color:var(--pri);background:#fff;font-weight:800}
.az-filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.az-filter{min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:17px;font-weight:800;color:#16325c;cursor:pointer}
.az-filter.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.az-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0 0 18px}
.az-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px;box-shadow:0 4px 14px rgba(20,40,60,.06)}
.az-kpi-n{font-size:48px;font-weight:800;color:#1a4fa0;line-height:1.1}
.az-kpi-l{margin-top:8px;font-weight:800;font-size:18px}
.az-kpi-s{margin-top:4px;font-size:15px;color:var(--mut)}
.az-kpi-classes .az-class-counts{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:18px;font-weight:700;color:#2a3440}
.az-kpi-classes .az-class-counts b{font-size:26px;font-weight:800;color:#1a4fa0}
.az-kpi-exam{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;display:block}
.az-kpi-exam:hover,.az-kpi-exam:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,98,176,.15);outline:none}
.az-idle .az-acts{margin-top:8px}
body.analyze-page{overflow:auto;background:#e8eef3}
body.analyze-page #analyzeView{position:fixed;inset:0;z-index:2}
body.analyze-page #toast{z-index:60;top:24px}

.az-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px 22px;margin:0 0 16px;box-shadow:0 4px 14px rgba(20,40,60,.06)}
.az-card h2{margin:0 0 10px;font-size:24px}
.az-card h4{margin:0 0 6px;font-size:18px}
.az-lead,.az-mut{color:var(--mut);font-size:16px;line-height:1.55;margin:0 0 12px}
.az-empty{color:var(--mut);text-align:center;padding:16px 8px;font-size:18px}
.az-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.az-table{width:100%;border-collapse:collapse;font-size:16px;line-height:1.5}
.az-table th,.az-table td{border-bottom:1px solid var(--line);padding:10px 10px;text-align:left;vertical-align:top}
.az-table th{font-size:14px;color:#355a7a;background:#f4f7fb;font-weight:800}
.az-bars{display:flex;flex-direction:column;gap:8px}
.az-bar{display:grid;grid-template-columns:88px 1fr 56px;gap:10px;align-items:center}
.az-bar-lab{font-size:15px;font-weight:700;color:#355a7a}
.az-bar-track{height:14px;background:#e8eef3;border-radius:99px;overflow:hidden}
.az-bar-fill{display:block;height:100%;background:var(--pri);border-radius:99px}
.az-bar-n{font-size:16px;font-weight:800;text-align:right}
.az-fill-block{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.az-fills{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.az-fills li{background:#f6f9fc;border-radius:10px;padding:10px 12px;font-size:16px}
.az-fill-text{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.55}
.az-tag{display:inline-block;margin-left:6px;font-size:13px;font-weight:800;color:#8a5a00;background:#fff4d6;border-radius:999px;padding:2px 10px}
.az-stu-h{cursor:pointer}
.az-stu-h:hover{background:#f5f9fd}
.az-honor-card h2{margin:0 0 8px}
.az-honor-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.az-honor-item{display:flex;align-items:flex-start;gap:10px;background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.az-honor-rank{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;line-height:1}
.az-honor-main{flex:1;min-width:0}
.az-honor-name{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-weight:800;font-size:18px;line-height:1.35;color:#1d2633}
.az-honor-who{min-width:0}
.az-honor-speak{margin:0;flex:0 0 auto}
.az-honor-scores{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-size:16px;font-weight:800;color:#16325c}
.az-honor-total,.az-score-total{color:var(--pri)}
.az-honor-meta{margin-top:4px;font-size:15px;line-height:1.45;color:#3a4654;font-weight:700}
.az-name-cell{min-width:14em}
.az-score-cell{min-width:12em}
.az-score-mini{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:2px 0;font-weight:800;font-size:14px;color:#3a4654}
.az-score-who{color:#16325c}
.az-speak-cell{min-width:11em}
.az-speak{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0}
.az-speak-name{font-weight:800;color:#16325c}
.az-speak-n{font-weight:800;font-size:15px}
.az-speak-btn{min-height:40px;min-width:44px;padding:6px 10px;font-weight:800;font-size:16px;position:relative;z-index:2;cursor:pointer;-webkit-tap-highlight-color:rgba(47,98,176,.25)}.az-speak-btn:active{transform:scale(.96);background:#e8f1ff}
.az-hidden-note{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#fff6e8;border:1px solid #f0d2a0;color:#6a4a16;font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.az-unhide-btn{min-height:36px;padding:4px 10px;font-weight:800}
body.proj-mode .az-hidden-note{font-size:20px}
body.proj-mode .az-honor-card h2{font-size:28px}
body.proj-mode .az-honor-card .az-lead{font-size:20px;line-height:1.5}
body.proj-mode .az-honor-rank{flex-basis:48px;width:48px;height:48px;font-size:24px}
body.proj-mode .az-honor-name{font-size:26px;gap:10px 14px}
body.proj-mode .az-honor-scores{font-size:22px}
body.proj-mode .az-honor-meta{font-size:20px;line-height:1.45}
body.proj-mode .az-score-mini{font-size:20px}
body.proj-mode .az-speak-name,body.proj-mode .az-speak-n{font-size:20px}
body.proj-mode .az-speak-btn{min-height:56px;min-width:64px;padding:10px 16px;font-size:22px}
.az-ans-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.az-ans-list li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:16px}
.az-kind{font-weight:800;color:#16325c}
.az-ok{color:var(--ok);font-weight:800}
.az-bad{color:var(--bad);font-weight:800}
@media (max-width:700px){
  .az-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .az-page{padding:14px 12px 36px}
  .az-page h1{font-size:28px}
  .az-kpi-n{font-size:36px}
  .az-acts .pri,.az-acts .ghost,.az-auto{min-height:44px;font-size:16px}
  .az-auto input{width:20px;height:20px}
}

.az-model-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.az-model-block h4{margin:0 0 6px;font-size:14px}
.az-model-block .az-fill-text{white-space:pre-wrap;font-size:13.5px;line-height:1.55}

/* —— 教师模式中控屏 —— */
#teacherDock{position:fixed;left:10px;top:120px;z-index:12;width:min(460px,calc(100% - 20px));max-height:min(78vh,740px);display:flex;flex-direction:column;background:rgba(255,255,255,.97);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(20,40,60,.16);overflow:hidden}
#teacherDock[hidden]{display:none!important}
#teacherDock .td-head{display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:8px 10px;background:#f4f8fd;border-bottom:1px solid var(--line);flex-shrink:0}
#teacherDock .td-head:active{cursor:grabbing}

#teacherDock.td-min .td-body,#teacherDock.td-min .th-draghint,#teacherDock.td-min #tdMin{display:none}
#teacherDock.td-min .td-head{border-bottom:0}

#teacherDock .td-jump{font-size:12px;padding:4px 9px;font-weight:700}
#teacherDock .td-jump-h{font-size:12px;font-weight:800;color:var(--mut);margin:8px 0 4px}
#teacherDock .td-sec{margin:4px 0 8px;font-size:16px}
#teacherDock .td-lead{margin:0 0 8px;font-size:13px;line-height:1.55;color:#2a3440}
#teacherDock .td-q{background:#f7fafc;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 8px}
#teacherDock .td-qp{font-weight:800;font-size:14px;line-height:1.5;margin:0 0 6px}
#teacherDock .td-qp .mut{font-weight:700;margin-left:6px}
#teacherDock .td-tag{display:inline-block;background:#efe6ff;color:#6b3fa0;border-radius:999px;padding:0 7px;font-size:11px;font-weight:800;margin-right:6px}
#teacherDock .td-opt{margin:6px 0}

#teacherDock .td-bar{height:6px;background:#e5ebf1;border-radius:9px;overflow:hidden;margin-top:3px}
#teacherDock .td-bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
#teacherDock .td-opt.right{background:#eef8f1;border-radius:8px;padding:4px 6px}

#teacherDock .td-flag{font-size:11px;font-weight:800;margin-top:2px}
#teacherDock .td-flag.ok{color:var(--ok)}
#teacherDock .td-why{margin-top:8px;background:#fff;border-radius:8px;padding:6px 8px}
#teacherDock .td-why-h{font-size:12px;font-weight:800;color:#8a4a00;margin:0 0 4px}
#teacherDock .td-why ul{margin:0;padding-left:18px}
#teacherDock .td-why li{font-size:12.5px;line-height:1.5;margin:3px 0}

#teacherDock .td-why em{font-style:normal;font-size:11px;font-weight:800;color:#8a4a00;margin:0 4px}
#teacherDock .td-explain{font-size:12.5px;line-height:1.55;background:#f6f9fc;border-radius:8px;padding:6px 8px;margin:0 0 8px;color:#2a3440}
#teacherDock .td-fills{margin:0;padding:0;list-style:none}
#teacherDock .td-fills li{margin:4px 0;font-size:12.5px}
#teacherDock .td-fill{white-space:pre-wrap;background:#fff;border-radius:6px;padding:4px 6px;margin-top:2px}
#teacherDock .td-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin:0 0 8px}

#teacherDock .td-classes b{color:var(--pri);font-size:16px}
#teacherDock .td-stu{border-top:1px solid var(--line)}
#teacherDock .td-stu-h{display:flex;flex-wrap:wrap;gap:6px 10px;width:100%;text-align:left;background:transparent;border:0;border-radius:0;padding:8px 2px;font-weight:700;font-size:12.5px}
#teacherDock .td-stu-h:hover{background:#f4f8fd}
#teacherDock .td-stu-d{padding:0 2px 8px}
#teacherDock .td-model{background:#f7faf7;border:1px solid #cfe0cf;border-radius:10px;padding:8px 10px;margin:0 0 8px}
#teacherDock .td-model h4{margin:0 0 4px;font-size:13px}
#teacherDock .td-chain{white-space:pre-wrap;font-size:12.5px;line-height:1.55}

#teacherDock .ok{color:var(--ok);font-weight:800}
#teacherDock .bad{color:var(--bad);font-weight:800}
#teacherDock .mut{color:var(--mut)}

#teacherDock .td-group{border:1.5px solid var(--line);border-radius:14px;margin:0 0 10px;background:#fff;overflow:hidden}

#teacherDock .td-caret{font-size:12px;color:var(--mut);font-weight:700}
#teacherDock .td-group-b{padding:8px 10px 10px}
#teacherDock .td-group-j{margin:0 0 8px}
#teacherDock .td-kpis.lg b{font-size:28px}
#teacherDock .td-kpis .warn b{color:#c05600}
#teacherDock .td-kpis .ok b{color:var(--ok)}
#teacherDock .td-kpis.lg span{font-size:12px;font-weight:700}
#teacherDock .td-rate{display:inline-block;margin-left:6px;font-weight:800;color:#2a3440;font-size:13px}
#teacherDock .td-opt.hot{background:#fff4d6;border:1.5px solid #e0a03a;border-radius:10px;padding:6px 8px;margin:8px 0}
#teacherDock .td-flag.hot{color:#8a4a00;font-size:13px;font-weight:800}
#teacherDock .td-why-inline{font-size:13px;line-height:1.5;color:#5a3a00;margin-top:2px;font-weight:700}
#teacherDock .td-names{margin:0 0 8px;font-size:13px}
#teacherDock .td-names b{display:block;margin:0 0 4px}
#teacherDock .td-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* —— 转录过程①–④：只显示当前一步，单卡置于画面上方；翻译过程已出现的讲解定格在左侧可回看 —— */
#txStepLayer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
#txStepSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#txStepSvg line{stroke:#c44872;stroke-width:1.5;stroke-opacity:.8}
#txStepSvg circle{fill:#c44872}
.tx-step#tls4,.tx-step#tls2,.tx-step#tls5{max-width:min(640px,calc(100% - 32px))}
.tx-step{position:absolute;z-index:3;max-width:min(520px,calc(100% - 32px));background:rgba(255,236,242,.96);border:1.5px solid #e08aa8;color:#5a2040;border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.5;font-weight:700;box-shadow:0 4px 14px rgba(80,20,40,.1);pointer-events:none;transform:translate(0,0)}

.az-opt-dist-h{font-weight:800;color:#16325c;margin:0 0 8px;font-size:18px}
.az-opt-dist ul{margin:0;padding:0;list-style:none}
.az-opt-dist li{margin:0 0 6px;font-size:17px;line-height:1.5}
.az-opt-dist li.is-ok{color:#1b6b3a}
.az-opt-dist li.is-bad{color:#9b2c2c}
.az-opt-tag{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;padding:1px 6px;border-radius:6px;background:#fde8e5;color:#9b2c2c;vertical-align:middle}
.az-opt-tag.ok{background:#e3f6ea;color:#1b6b3a}
.az-opt-wrong{margin:8px 0 0;font-size:17px;font-weight:700;color:#16325c;line-height:1.55}
.az-opt-line{margin:6px 0 0;font-size:16px;line-height:1.55;color:#16325c;font-weight:600}
.az-legacy{margin-top:14px;padding-top:10px;border-top:1px dashed #d7c7a8}
.az-legacy-h{font-weight:800;margin:0 0 8px;font-size:16px;color:#5a4630}

.az-pre-q{border-top:1px solid var(--line);padding:16px 0 8px}
.az-pre-q:first-of-type{border-top:0;padding-top:0}
.az-pre-no{font-weight:800;color:#1a4fa0;font-size:20px}
.az-pre-text{margin:6px 0 8px;font-size:22px;font-weight:700;line-height:1.45;color:#1d2633}
.az-pre-sub{margin:0 0 4px;font-size:18px;font-weight:700;color:#2a3440}
.az-exam h3{margin:0 0 8px;font-size:26px}
.az-ok,.az-bad{font-size:20px}

.az-overview-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.az-overview-bar .az-lead{margin:0;font-size:18px;font-weight:700;color:#2a3440;flex:1;min-width:220px}
.az-fold-acts{display:flex;gap:10px;flex-wrap:wrap}
.az-fold-acts .pri,.az-fold-acts .ghost{min-height:48px;padding:10px 20px;font-size:18px;font-weight:800}
.az-fold-h{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;cursor:pointer}
.az-fold-h-static{cursor:default}
.az-fold-title{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;min-width:0;flex:1}
.az-card.az-fold{padding:16px 22px}
.az-card.az-fold > .az-fold-h h2{margin:0}
.az-detail-btn{flex-shrink:0;min-height:48px;min-width:96px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.az-fold.is-open > .az-fold-h .az-detail-btn{background:var(--pri);color:#fff}
.az-fold-b{margin-top:10px}
.az-fold-b[hidden]{display:none!important}
.az-inline{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
.az-inline b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;margin-right:4px}
.az-in-ok b{color:#15803d}
.az-in-bad b{color:#b91c1c}
.az-in-n b{color:#1a4fa0}
.az-in-ok,.az-in-bad,.az-in-n,.az-in-rate,.az-in-wait{font-size:18px;font-weight:800;color:#2a3440;white-space:nowrap}
.az-in-rate{font-size:22px;color:#16325c}
.az-key-brief{font-size:18px;font-weight:700;color:#8a4a00;background:#fff8e8;border:1px solid #ead7a2;border-radius:8px;padding:4px 10px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.az-pre-overview{display:grid;grid-template-columns:1fr;gap:0}
.az-pre-q.az-fold{border-top:1px solid var(--line);padding:8px 0}
.az-pre-q.az-fold:first-of-type{border-top:0;padding-top:0}
.az-pre-q .az-fold-h{align-items:center}
.az-pre-q .az-fold-title{flex:1;min-width:0}
.az-pre-clip{margin:0;font-size:20px;font-weight:700;line-height:1.35;color:#1d2633;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px;min-width:0}
.az-pre-q.is-open{grid-column:1/-1}
.az-exam.az-fold{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.az-exam.az-fold:last-child{border-bottom:0;padding-bottom:0}
.az-exam .az-fold-title h3{margin:0;font-size:26px}
@media (min-width:900px){
  .az-pre-overview{grid-template-columns:1fr 1fr;column-gap:24px}
  .az-pre-q.az-fold{padding:10px 6px}
  .az-pre-overview > .az-pre-q.az-fold:nth-child(-n+2){border-top:0;padding-top:0}
}
@media (max-width:700px){
  .az-inline b{font-size:32px}
  .az-count b{font-size:48px}
  .az-detail-btn{min-width:80px;min-height:44px;font-size:16px}
  .az-overview-bar .az-lead{font-size:15px}
}

.az-tag-wait{background:#fff4d6;color:#8a5a00}
.az-blanks{margin:6px 0 0;padding:0;list-style:none}
.az-blanks li{margin:0 0 4px;font-size:16px;line-height:1.45}
.az-blank-ok b{color:#1f7a43}
.az-blank-bad b{color:var(--bad)}
.az-blank-wait b{color:#8a5a00}
.az-exam-photo{margin:8px 0 0}
.az-exam-photo img{display:block;max-width:240px;max-height:180px;width:auto;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}

@media (max-width:1100px){.az-js-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
